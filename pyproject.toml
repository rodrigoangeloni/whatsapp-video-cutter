[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-video-cutter"
version = "1.0.0"
description = "Cortador y compresor visual de grabaciones para WhatsApp (< 180 MB) con aceleracion GPU NVENC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Rodrigo Angeloni" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pillow>=10.0",
  "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
